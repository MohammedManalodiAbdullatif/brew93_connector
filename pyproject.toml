[project]
name = "brew93_connector"
authors = [
    { name = "KlyONIX Tech Consulting Private Limited", email = "hello@klyonix.com" },
]
description = "Brew93 CRM <-> ERPNext bidirectional integration (isolated connector app)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "PyJWT>=2.8,<3",
    # requests is already provided by the Frappe framework; declared for clarity.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
